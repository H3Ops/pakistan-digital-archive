<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pakistan Digital Archive — Prototype</title>

  <!-- Authentic Urdu Nastaliq Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f4;
      color: #1a1a1a;
    }

    header {
      background-color: #01411C; /* Pakistan Green */
      color: white;
      padding: 24px;
      text-align: center;
    }

    .urdu {
      font-family: 'Noto Nastaliq Urdu', serif;
      direction: rtl;
      line-height: 2;
    }

    .controls {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border: 1px solid #01411C;
      background: white;
      color: #01411C;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    button.active {
      background: #01411C;
      color: white;
    }

    .grid {
      max-width: 800px;
      margin: 0 auto 40px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tag {
      font-size: 12px;
      background: #e6f0ea;
      color: #01411C;
      padding: 3px 8px;
      border-radius: 4px;
      width: fit-content;
    }

    .read-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      background: #01411C;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
    }

    .read-btn:hover {
      background: #025c27;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="urdu">قومی ڈیجیٹل کتب خانہ اور ثقافتی آرکائیو</h1>
    <p>National E-Library & Cultural Archive (Prototype)</p>
  </header>

  <main class="controls">
    <input type="text" id="searchInput" placeholder="Search in English or Roman Urdu (e.g., Iqbal, Tain Tain Fish)..." />

    <div class="filters">
      <button class="active" onclick="filterCategory('all', this)">All</button>
      <button onclick="filterCategory('literature', this)">Literature</button>
      <button onclick="filterCategory('textbooks', this)">Textbooks</button>
      <button onclick="filterCategory('ptv', this)">PTV Archives</button>
    </div>
  </main>

  <section class="grid" id="archiveGrid"></section>

  <script>
    const archiveItems = [
      {
        titleEn: "Tain Tain Fish — Gul Nokhaiz Akhtar",
        titleUr: "ٹیں ٹیں فش",
        category: "literature",
        year: "2010",
        access: "Free",
        link: "reader.html"
      },
      {
        titleEn: "Kulliyat-e-Iqbal",
        titleUr: "کلیاتِ اقبال",
        category: "literature",
        year: "1924",
        access: "Free",
        link: "#"
      },
      {
        titleEn: "NBF Physics Grade 10",
        titleUr: "طبیعیات جماعت دہم",
        category: "textbooks",
        year: "2024",
        access: "Free",
        link: "#"
      },
      {
        titleEn: "Dhoop Kinare (PTV Classic)",
        titleUr: "دھوپ کنارے",
        category: "ptv",
        year: "1987",
        access: "Diaspora Sub / Free Domestic",
        link: "#"
      }
    ];

    let currentCategory = "all";

    function getSafeHref(url) {
      if (typeof url !== "string") return "#";
      const trimmed = url.trim();
      if (trimmed === "#") return "#";
      if (/^[a-zA-Z0-9._/-]+\.html([?#].*)?$/.test(trimmed)) {
        return trimmed;
      }
      return "#";
    }

    function renderItems() {
      const grid = document.getElementById("archiveGrid");
      const searchText = document.getElementById("searchInput").value.toLowerCase();
      grid.innerHTML = "";

      for (let i = 0; i < archiveItems.length; i++) {
        const item = archiveItems[i];

        const matchesCategory = (currentCategory === "all" || item.category === currentCategory);
        const matchesSearch = item.titleEn.toLowerCase().includes(searchText) || item.titleUr.includes(searchText);

        if (matchesCategory && matchesSearch) {
          const safeLink = getSafeHref(item.link);
          const isReadable = safeLink === "reader.html";

          grid.innerHTML += `
            <div class="card">
              <div>
                <span class="tag">${item.category.toUpperCase()}</span>
                <h2 class="urdu">${item.titleUr}</h2>
                <h3>${item.titleEn}</h3>
                <p>Year: ${item.year} • ${item.access}</p>
              </div>
              <a href="${safeLink}" class="read-btn">
                ${isReadable ? "Read Book →" : "Coming Soon"}
              </a>
            </div>
          `;
        }
      }
    }

    function filterCategory(category, clickedButton) {
      currentCategory = category;

      const buttons = document.querySelectorAll(".filters button");
      buttons.forEach(btn => btn.classList.remove("active"));
      clickedButton.classList.add("active");

      renderItems();
    }

    document.getElementById("searchInput").addEventListener("input", renderItems);

    renderItems();
  </script>

</body>
</html>
